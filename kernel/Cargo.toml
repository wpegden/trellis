[package]
name = "trellis-kernel"
version = "0.3.0"
edition = "2021"
build = "build.rs"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "trellis_kernel"
path = "src/lib.rs"

[[bin]]
name = "trellis_kernel_cli"
path = "src/bin/cli.rs"

[[bin]]
name = "trellis_runtime_cli"
path = "src/bin/runtime_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
enum_dispatch = "0.3"
base64 = "0.22"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
getrandom = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["filters", "json", "redactions"] }
proptest = "1"
tempfile = "3"

[features]
# Feature-gated integration-test support (W1 Tier 1): compiled into the lib
# ONLY for test builds (the self dev-dependency below enables it for every
# test target); production builds (default features) exclude it, so no test
# scaffolding enters the production kernel binary.
test-support = []

[dev-dependencies.trellis-kernel]
path = "."
features = ["test-support"]
