SPECIFICATION Spec

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOK
    HumanGateMatchesState
    InFlightKindMatchesStage
    CleanupHasNoBlockers
    NoAdvancePhaseWithBlockers
    CleanupDoneTerminal
    StalePassClosurePreventsCleanupAdvance
    CoarseAnchorSafe
    AnchorChangeForbiddenDuringGlobalRepair
    LocalModeSoundnessCarveOut
    AuthorizedNodesScopeContract
    PendingTaskStaging
    PhaseDormancyContract
    QuiescentLiveEqualsCommitted
    GlobalBlockersExhaustive
    ReviewerScopeAuthorizationComplete
    GlobalRepairLifecycle
    SingleAuditAtATime
    AuditStageConsistency
    \* PV mode-B prove-or-disprove invariants (forward design).
    ModeBConfiguredTargetsEmpty
    SoundnessFloor
    NotBothSidesClosed
    NoHumanInModeB
    UnderModelAssumptionLifecycleContract
    CoverageOnLiveOnly
    DecidedResolves

\* AuditSoleFlipper (action property: only an audit step changes
\* challengePolarity) is two-state and not reliably checked under -simulate;
\* it is enforced structurally via the UNCHANGED-PolarityVars discipline. See
\* SupervisorCoreSim_modeb.cfg for the rationale.

\* Random simulation mode (-simulate num=N -depth D).  Use for SimNodes
\* > 1 where exhaustive search is intractable.  Invoke as:
\*   java -jar tla2tools.jar -simulate num=50000 -depth 40 \
\*       -config SupervisorCore.sim.cfg SupervisorCoreSim.tla
