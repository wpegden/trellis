SPECIFICATION Spec

\* Deadlocks at MaxCycle are expected (cycle counter saturates and
\* StartCycle's `cycle < MaxCycle` precondition disables further progress).
\* Bound-induced terminal, not a real protocol deadlock.
CHECK_DEADLOCK
    FALSE

INVARIANTS
    \* Existing Core safety invariants (must still hold in mode-B).
    TypeOK
    HumanGateMatchesState
    InFlightKindMatchesStage
    CleanupHasNoBlockers
    NoAdvancePhaseWithBlockers
    CompleteRequiresChallengeCoverage
    CleanupDoneTerminal
    StalePassClosurePreventsCleanupAdvance
    CoarseAnchorSafe
    AnchorChangeForbiddenDuringGlobalRepair
    LocalModeSoundnessCarveOut
    AuthorizedNodesScopeContract
    PendingTaskStaging
    PhaseDormancyContract
    QuiescentLiveEqualsCommitted
    GlobalBlockersExhaustive
    ReviewerScopeAuthorizationComplete
    GlobalRepairLifecycle
    SingleAuditAtATime
    AuditStageConsistency
    \* PV mode-B prove-or-disprove invariants (the deliverable).
    ModeBConfiguredTargetsEmpty
    SoundnessFloor
    NotBothSidesClosed
    NoHumanInModeB
    UnderModelAssumptionLifecycleContract
    CoverageOnLiveOnly
    DecidedResolves

\* AuditSoleFlipper (the "only an audit step changes challengePolarity"
\* property) is a TWO-STATE / action property — it cannot be listed under
\* INVARIANTS, and TLC's -simulate mode does not check PROPERTIES reliably
\* (it hangs at temporal-property setup).  It is instead enforced
\* STRUCTURALLY: every non-audit action carries `UNCHANGED PolarityVars`
\* (TLC errors on any action that omits a variable), and AcceptStuckMathAudit
\* is the sole action that assigns challengePolarity.  For an explicit
\* machine check, run the action-property form `AuditSoleFlipperProp` under a
\* bounded EXHAUSTIVE (BFS) Core run — out of scope for this sim-only cfg.

\* Random simulation mode (-simulate num=N -depth D).  This is the cheap Core
\* harness; mode-B prove-or-disprove with two opposite-truth Decide targets.
\* Invoke as:
\*   java -jar tla2tools.jar -simulate num=200000 -depth 40 \
\*       -config SupervisorCoreSim_modeb.cfg SupervisorCoreSim_modeb.tla
