SPECIFICATION Spec

CHECK_DEADLOCK
    FALSE

\* DoneReachable BAIT (expected-FAIL, NOT in the green suite).  A violation
\* of DoneNeverViaDisprove is the witness: a mode-B run that reaches Done
\* having decided c2 via the DISPROVE side.  This simultaneously witnesses
\* (a) Done is reachable in mode-B, and (b) a disproved target counts as
\* resolved for completion (DecidedResolves on the disprove side).
INVARIANTS
    DoneNeverViaDisprove

\* Invoke under -simulate (sim-only):
\*   java -jar tla2tools.jar -simulate num=5000000 -depth 120 -seed S \
\*       -config SupervisorCoreSim_modeb_reach.cfg SupervisorCoreSim_modeb_reach.tla
