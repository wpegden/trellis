SPECIFICATION Spec

CHECK_DEADLOCK
    FALSE

\* DoneReachable BAIT (expected-FAIL, NOT in the green suite).  Reachability
\* of phase = "complete" is a liveness claim; under simulation we witness it
\* by asserting its NEGATION (`DoneNeverComplete == phase # "complete"`) as an
\* invariant.  TLC must report a violation — the counterexample trace is the
\* WITNESS that Done is reachable in mode-B, including a run that decides the
\* `c2` target via the DISPROVE side (DecidedResolves on the disprove side).
\* A clean (no-violation) run here means the sim did not happen to drive a
\* completion; raise num/depth/seed and re-run.  Run once to confirm
\* reachability; never add to the green suite.
INVARIANTS
    DoneNeverComplete

\* Invoke as:
\*   java -jar tla2tools.jar -simulate num=500000 -depth 60 \
\*       -config SupervisorCoreSim_modeb_donereachable.cfg \
\*       SupervisorCoreSim_modeb.tla
